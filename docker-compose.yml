services:
  db:
    image: postgres:16
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_DB: contribution_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hubpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d contribution_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      network: host
    network_mode: host
    env_file: .env
    volumes:
      - ./imports:/app/imports
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
      args:
        API_URL: http://127.0.0.1:8000
    network_mode: host
    environment:
      API_URL: http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
